<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive Phonetic Plasticity ISC Results</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 105px;
      padding: 10px 16px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0 0 8px;
      color: #ddd;
      font-size: 14px;
    }

    label {
      font-size: 14px;
    }

    select {
      margin-left: 6px;
      padding: 4px 8px;
      font-size: 14px;
    }

    #viewer-container {
      position: relative;
      width: 100%;
      height: calc(100% - 105px);
    }

    #gl {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      color: white;
      background: rgba(160, 0, 0, 0.9);
      border-radius: 5px;
      display: none;
    }

  </style>

</head>


<body>

  <header>

    <h1>Interactive BARBIE ISC Results</h1>

    <p>
      Whole-brain inter-subject correlation results thresholded at
      FDR q &lt; .05 and cluster extent k ≥ 60 voxels.
    </p>

    <label for="modelSelect">

      Model:

      <select id="modelSelect">

        <option value="Intercept">
          Intercept
        </option>

        <option value="NN">
          Plasticity Difference (NN)
        </option>

        <option value="AnnaK">
          Mean Plasticity (AnnaK)
        </option>

      </select>

    </label>

  </header>


  <div id="viewer-container">

    <canvas id="gl"></canvas>

    <div id="error"></div>

  </div>


  <script type="module">

    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.69.0/dist/index.js";


    // =========================================================
    // FILES
    // =========================================================

    const underlayFile =
      "./MNI152_2009_template.nii.gz";


    const files = {

      Intercept:
        "./Intercept_q05_k60.nii.gz",

      AnnaK:
        "./AnnaK_q05_k60.nii.gz",

      NNpositive:
        "./NN_positive_q05_k60.nii.gz",

      NNnegative:
        "./NN_negative_q05_k60.nii.gz"

    };


    // =========================================================
    // ELEMENTS
    // =========================================================

    const errorBox =
      document.getElementById("error");

    const modelSelect =
      document.getElementById("modelSelect");


    // =========================================================
    // NIIVUE
    // =========================================================

    const nv = new Niivue({

      isResizeCanvas: true,

      backColor: [
        0.05,
        0.05,
        0.05,
        1
      ],

      isColorbar: true

    });


    // =========================================================
    // UTILITY:
    // FIND POSITIVE NONZERO RANGE
    // =========================================================

    function setPositiveRange(volume) {

      let minimum = Infinity;
      let maximum = -Infinity;


      for (
        let i = 0;
        i < volume.img.length;
        i++
      ) {

        const value =
          volume.img[i];


        if (
          !Number.isFinite(value) ||
          value <= 0
        ) {
          continue;
        }


        if (value < minimum) {
          minimum = value;
        }


        if (value > maximum) {
          maximum = value;
        }

      }


      if (
        minimum !== Infinity &&
        maximum !== -Infinity
      ) {

        volume.cal_min =
          minimum;

        volume.cal_max =
          maximum;

      }

    }


    // =========================================================
    // LOAD MODEL
    // =========================================================

    async function loadModel(modelName) {

      try {

        errorBox.style.display =
          "none";


        // =====================================================
        // NN ONLY
        //
        // NN is deliberately split into two positive-valued
        // images.
        //
        // Original negative NN coefficients:
        //     warm colors
        //
        // Original positive NN coefficients:
        //     cool colors
        //
        // This avoids NiiVue's signed-map zero-background issue.
        // =====================================================

        if (modelName === "NN") {


          await nv.loadVolumes([

            {

              url:
                underlayFile,

              colormap:
                "gray",

              opacity:
                1,

              colorbarVisible:
                false

            },


            {

              url:
                files.NNnegative,

              // Original NEGATIVE NN values
              // displayed as warm colors

              colormap:
                "warm",

              opacity:
                0.9,

              colorbarVisible:
                true,

              alphaThreshold:
                true,

              ignoreZeroVoxels:
                true

            },


            {

              url:
                files.NNpositive,

              // Original POSITIVE NN values
              // displayed as cool colors

              colormap:
                "winter",

              opacity:
                0.9,

              colorbarVisible:
                true,

              alphaThreshold:
                true,

              ignoreZeroVoxels:
                true

            }

          ]);


          // Volume 1 = original negative NN values
          // Volume 2 = original positive NN values

          setPositiveRange(
            nv.volumes[1]
          );

          setPositiveRange(
            nv.volumes[2]
          );


          nv.volumes[0].colorbarVisible =
            false;


          nv.updateGLVolume();


          return;

        }


        // =====================================================
        // INTERCEPT + ANNAK
        //
        // Restore the exact approach that was already working.
        // =====================================================

        let overlaySettings;


        if (modelName === "Intercept") {

          overlaySettings = {

            url:
              files.Intercept,

            colormap:
              "warm",

            colormapNegative:
              "winter",

            useNegativeCmap:
              false,

            opacity:
              0.9,

            colorbarVisible:
              true

          };

        }


        else {

          // ANNAK

          overlaySettings = {

            url:
              files.AnnaK,

            colormap:
              "warm",

            colormapNegative:
              "winter",

            useNegativeCmap:
              true,

            opacity:
              0.9,

            colorbarVisible:
              true

          };

        }


        await nv.loadVolumes([

          {

            url:
              underlayFile,

            colormap:
              "gray",

            opacity:
              1,

            colorbarVisible:
              false

          },


          overlaySettings

        ]);


        // =====================================================
        // ORIGINAL WORKING SIGNED-MAP RANGE CODE
        // =====================================================

        const overlay =
          nv.volumes[1];


        let smallestPositive =
          Infinity;

        let largestPositive =
          -Infinity;

        let mostNegative =
          Infinity;

        let leastNegative =
          -Infinity;


        for (
          let i = 0;
          i < overlay.img.length;
          i++
        ) {

          const value =
            overlay.img[i];


          if (!Number.isFinite(value)) {
            continue;
          }


          if (value > 0) {

            if (
              value < smallestPositive
            ) {

              smallestPositive =
                value;

            }


            if (
              value > largestPositive
            ) {

              largestPositive =
                value;

            }

          }


          if (value < 0) {

            if (
              value < mostNegative
            ) {

              mostNegative =
                value;

            }


            if (
              value > leastNegative
            ) {

              leastNegative =
                value;

            }

          }

        }


        if (
          smallestPositive !== Infinity
        ) {

          overlay.cal_min =
            smallestPositive;

          overlay.cal_max =
            largestPositive;

        }


        if (
          mostNegative !== Infinity
        ) {

          overlay.cal_minNeg =
            mostNegative;

          overlay.cal_maxNeg =
            leastNegative;

        }


        if (
          modelName === "Intercept"
        ) {

          overlay.useNegativeCmap =
            false;

        }


        nv.volumes[0].colorbarVisible =
          false;


        nv.updateGLVolume();

      }


      catch (error) {

        console.error(error);


        errorBox.style.display =
          "block";


        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    // =========================================================
    // START
    // =========================================================

    async function startViewer() {

      try {

        await nv.attachTo("gl");


        await loadModel(
          "Intercept"
        );

      }


      catch (error) {

        console.error(error);


        errorBox.style.display =
          "block";


        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    // =========================================================
    // DROPDOWN
    // =========================================================

    modelSelect.addEventListener(

      "change",

      async function () {

        await loadModel(
          this.value
        );

      }

    );


    startViewer();

  </script>

</body>

</html>
