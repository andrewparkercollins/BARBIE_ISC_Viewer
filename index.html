<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive BARBIE ISC Results</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 105px;
      padding: 10px 16px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0 0 8px;
      color: #ddd;
      font-size: 14px;
    }

    label {
      font-size: 14px;
    }

    select {
      margin-left: 6px;
      padding: 4px 8px;
      font-size: 14px;
    }

    #viewer-container {
      position: relative;
      width: 100%;
      height: calc(100% - 105px);
    }

    #gl {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      color: white;
      background: rgba(160, 0, 0, 0.9);
      border-radius: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Interactive BARBIE ISC Results</h1>

    <p>
      Whole-brain inter-subject correlation results thresholded at
      FDR q &lt; .05 and cluster extent k ≥ 60 voxels.
    </p>

    <label for="modelSelect">
      Model:
      <select id="modelSelect">
        <option value="Intercept">Intercept</option>
        <option value="NN">Plasticity Difference (NN)</option>
        <option value="AnnaK">Mean Plasticity (AnnaK)</option>
      </select>
    </label>
  </header>

  <div id="viewer-container">
    <canvas id="gl"></canvas>
    <div id="error"></div>
  </div>

  <script type="module">

    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.69.0/dist/index.js";

    const underlayFile =
      "./MNI152_2009_template.nii.gz";

    const files = {
      Intercept: "./Intercept_q05_k60.nii.gz",
      AnnaK: "./AnnaK_q05_k60.nii.gz",
      NN: "./NN_q05_k60.nii.gz"
    };

    const errorBox =
      document.getElementById("error");

    const modelSelect =
      document.getElementById("modelSelect");

    const nv = new Niivue({
      isResizeCanvas: true,
      backColor: [0.05, 0.05, 0.05, 1],
      isColorbar: true
    });


    async function loadModel(modelName) {

      try {

        errorBox.style.display = "none";


        // =====================================================
        // NN ONLY
        //
        // Use the original signed NN file.
        // All surviving values are negative:
        //   -0.0309572 to -0.00820608
        //
        // We give the negative values the warm color scale.
        // We set a dummy positive range > 1 so zero background
        // is not colored on the positive side.
        // =====================================================

        if (modelName === "NN") {

          await nv.loadVolumes([

            {
              url: underlayFile,
              colormap: "gray",
              opacity: 1,
              colorbarVisible: false
            },

            {
              url: files.NN,

              // Positive side (there are no surviving positives)
              colormap: "winter",

              // Negative side (the actual surviving NN signal)
              colormapNegative: "warm",

              useNegativeCmap: true,

              opacity: 0.9,
              colorbarVisible: true,

              ignoreZeroVoxels: true,
              alphaThreshold: true,
              trustCalMinMax: true,

              // Dummy positive range so zeros do not get mapped
              cal_min: 1,
              cal_max: 2,

              // Real negative range from 3dBrickStat
              cal_minNeg: -0.0309572,
              cal_maxNeg: -0.00820608
            }

          ]);

          const overlay = nv.volumes[1];

          // Reassert calibration after load
          overlay.cal_min = 1;
          overlay.cal_max = 2;

          overlay.cal_minNeg = -0.0309572;
          overlay.cal_maxNeg = -0.00820608;

          overlay.useNegativeCmap = true;

          nv.volumes[0].colorbarVisible = false;

          nv.updateGLVolume();

          return;
        }


        // =====================================================
        // INTERCEPT + ANNAK
        //
        // Keep the previously working logic unchanged.
        // =====================================================

        let overlaySettings;

        if (modelName === "Intercept") {

          overlaySettings = {
            url: files.Intercept,
            colormap: "warm",
            colormapNegative: "winter",
            useNegativeCmap: false,
            opacity: 0.9,
            colorbarVisible: true
          };

        } else {

          overlaySettings = {
            url: files.AnnaK,
            colormap: "warm",
            colormapNegative: "winter",
            useNegativeCmap: true,
            opacity: 0.9,
            colorbarVisible: true
          };

        }

        await nv.loadVolumes([

          {
            url: underlayFile,
            colormap: "gray",
            opacity: 1,
            colorbarVisible: false
          },

          overlaySettings

        ]);

        const overlay = nv.volumes[1];

        let smallestPositive = Infinity;
        let largestPositive = -Infinity;

        let mostNegative = Infinity;
        let leastNegative = -Infinity;

        for (let i = 0; i < overlay.img.length; i++) {

          const value = overlay.img[i];

          if (!Number.isFinite(value)) {
            continue;
          }

          if (value > 0) {
            if (value < smallestPositive) {
              smallestPositive = value;
            }
            if (value > largestPositive) {
              largestPositive = value;
            }
          }

          if (value < 0) {
            if (value < mostNegative) {
              mostNegative = value;
            }
            if (value > leastNegative) {
              leastNegative = value;
            }
          }
        }

        if (smallestPositive !== Infinity) {
          overlay.cal_min = smallestPositive;
          overlay.cal_max = largestPositive;
        }

        if (mostNegative !== Infinity) {
          overlay.cal_minNeg = mostNegative;
          overlay.cal_maxNeg = leastNegative;
        }

        if (modelName === "Intercept") {
          overlay.useNegativeCmap = false;
        }

        nv.volumes[0].colorbarVisible = false;

        nv.updateGLVolume();

      } catch (error) {

        console.error(error);

        errorBox.style.display = "block";
        errorBox.textContent =
          "Viewer error: " +
          (error?.message || String(error));
      }
    }


    async function startViewer() {

      try {
        await nv.attachTo("gl");
        await loadModel("Intercept");
      } catch (error) {
        console.error(error);
        errorBox.style.display = "block";
        errorBox.textContent =
          "Viewer error: " +
          (error?.message || String(error));
      }
    }

    modelSelect.addEventListener(
      "change",
      async function () {
        await loadModel(this.value);
      }
    );

    startViewer();

  </script>

</body>
</html>
