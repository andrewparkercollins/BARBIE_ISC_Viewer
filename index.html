<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive BARBIE ISC Results</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 105px;
      padding: 10px 16px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0 0 8px;
      color: #ddd;
      font-size: 14px;
    }

    label {
      font-size: 14px;
    }

    select {
      margin-left: 6px;
      padding: 4px 8px;
      font-size: 14px;
    }

    #viewer-container {
      position: relative;
      width: 100%;
      height: calc(100% - 105px);
    }

    #gl {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      color: white;
      background: rgba(160, 0, 0, 0.9);
      border-radius: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Interactive BARBIE ISC Results</h1>

    <p>
      Whole-brain inter-subject correlation results thresholded at
      FDR q &lt; .05 and cluster extent k ≥ 60 voxels.
    </p>

    <label for="modelSelect">
      Model:
      <select id="modelSelect">
        <option value="Intercept">Intercept</option>
        <option value="NN">Plasticity Difference (NN)</option>
        <option value="AnnaK">Mean Plasticity (AnnaK)</option>
      </select>
    </label>
  </header>

  <div id="viewer-container">
    <canvas id="gl"></canvas>
    <div id="error"></div>
  </div>


  <script type="module">

    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.69.0/dist/index.js";


    const underlayFile =
      "./MNI152_2009_template.nii.gz";


    const modelFiles = {

      Intercept:
        "./Intercept_q05_k60.nii.gz",

      NN:
        "./NN_q05_k60.nii.gz",

      AnnaK:
        "./Annak_q05_k60.nii.gz"

    };


    const errorBox =
      document.getElementById("error");

    const modelSelect =
      document.getElementById("modelSelect");


    const nv = new Niivue({

      isResizeCanvas: true,

      backColor: [
        0.05,
        0.05,
        0.05,
        1
      ],

      isColorbar: true

    });


    async function loadModel(modelName) {

      try {

        errorBox.style.display = "none";


        let overlaySettings;


        // =====================================================
        // NN ONLY
        //
        // This is the ONLY model receiving special treatment.
        //
        // Positive NN values = cool colors
        // Negative NN values = warm colors
        //
        // Zero-valued background is explicitly ignored.
        // =====================================================

        if (modelName === "NN") {

          overlaySettings = {

            url:
              modelFiles.NN,

            // positive values = cool
            colormap:
              "winter",

            // negative values = warm
            colormapNegative:
              "warm",

            opacity:
              0.9,

            colorbarVisible:
              true,

            // NN ONLY:
            // prevent zero background from affecting scaling
            ignoreZeroVoxels:
              true,

            // NN ONLY:
            // make values outside the calibrated ranges transparent
            alphaThreshold:
              true,

            trustCalMinMax:
              true

          };

        }


        // =====================================================
        // INTERCEPT
        //
        // Leave styling alone.
        // =====================================================

        else if (modelName === "Intercept") {

          overlaySettings = {

            url:
              modelFiles.Intercept,

            colormap:
              "warm",

            opacity:
              0.9,

            colorbarVisible:
              true

          };

        }


        // =====================================================
        // ANNAK
        //
        // Leave styling alone.
        // =====================================================

        else {

          overlaySettings = {

            url:
              modelFiles.AnnaK,

            colormap:
              "warm",

            colormapNegative:
              "winter",

            opacity:
              0.9,

            colorbarVisible:
              true

          };

        }


        // =====================================================
        // LOAD MNI + SELECTED MODEL
        // =====================================================

        await nv.loadVolumes([

          {
            url:
              underlayFile,

            colormap:
              "gray",

            opacity:
              1,

            colorbarVisible:
              false
          },

          overlaySettings

        ]);


        const overlay =
          nv.volumes[1];


        // =====================================================
        // DETERMINE NON-ZERO STATISTICAL RANGE
        //
        // Same working behavior used previously for Intercept
        // and AnnaK.
        // =====================================================

        let smallestPositive =
          Infinity;

        let largestPositive =
          -Infinity;

        let mostNegative =
          Infinity;

        let leastNegative =
          -Infinity;


        for (
          let i = 0;
          i < overlay.img.length;
          i++
        ) {

          const value =
            overlay.img[i];


          if (!Number.isFinite(value)) {
            continue;
          }


          if (value === 0) {
            continue;
          }


          if (value > 0) {

            if (
              value < smallestPositive
            ) {

              smallestPositive =
                value;

            }


            if (
              value > largestPositive
            ) {

              largestPositive =
                value;

            }

          }


          if (value < 0) {

            if (
              value < mostNegative
            ) {

              mostNegative =
                value;

            }


            if (
              value > leastNegative
            ) {

              leastNegative =
                value;

            }

          }

        }


        // =====================================================
        // POSITIVE RANGE
        // =====================================================

        if (
          smallestPositive !== Infinity
        ) {

          overlay.cal_min =
            smallestPositive;

          overlay.cal_max =
            largestPositive;

        }


        // =====================================================
        // NEGATIVE RANGE
        //
        // NiiVue expects:
        //
        // cal_minNeg = most negative value
        // cal_maxNeg = negative value closest to zero
        // =====================================================

        if (
          mostNegative !== Infinity
        ) {

          overlay.cal_minNeg =
            mostNegative;

          overlay.cal_maxNeg =
            leastNegative;

        }


        // =====================================================
        // INTERCEPT
        //
        // Ensure no negative scale is used.
        // =====================================================

        if (
          modelName === "Intercept"
        ) {

          overlay.colormapNegative =
            "";

        }


        // =====================================================
        // NN ONLY:
        //
        // Reinforce the flipped color maps AFTER loading.
        // This does not affect AnnaK or Intercept.
        // =====================================================

        if (
          modelName === "NN"
        ) {

          nv.setColormap(
            overlay.id,
            "winter"
          );

          nv.setColormapNegative(
            overlay.id,
            "warm"
          );

        }


        // =====================================================
        // ANNAK ONLY:
        //
        // Preserve the working warm-positive /
        // cool-negative appearance.
        // =====================================================

        if (
          modelName === "AnnaK"
        ) {

          nv.setColormap(
            overlay.id,
            "warm"
          );

          nv.setColormapNegative(
            overlay.id,
            "winter"
          );

        }


        // Hide MNI color bar

        nv.volumes[0].colorbarVisible =
          false;


        nv.updateGLVolume();

      }


      catch (error) {

        console.error(error);

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    async function startViewer() {

      try {

        await nv.attachTo("gl");

        await loadModel(
          "Intercept"
        );

      }


      catch (error) {

        console.error(error);

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    modelSelect.addEventListener(

      "change",

      async function () {

        await loadModel(
          this.value
        );

      }

    );


    startViewer();

  </script>

</body>
</html>
