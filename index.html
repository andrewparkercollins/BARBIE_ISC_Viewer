<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Interactive Iguana MRI</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 75px;
      padding: 10px 15px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0;
      font-size: 14px;
    }

    #gl {
      display: block;
      width: 100%;
      height: calc(100% - 75px);
    }

    #error {
      color: #ff8080;
      padding: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Interactive Iguana MRI</h1>
    <p>Drag, scroll, and tap the image to explore the volume.</p>
  </header>

  <canvas id="gl"></canvas>
  <div id="error"></div>

  <script type="module">
    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.57.0/dist/index.js";

    async function startViewer() {
      try {
        const nv = new Niivue();

        await nv.attachTo("gl");
        
      } catch (error) {
        document.getElementById("error").textContent =
          "Viewer error: " + error.message;

        console.error(error);
      }
    }

    startViewer();
  </script>
</body>
</html>
