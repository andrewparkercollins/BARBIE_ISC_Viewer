<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>BARBIE ISC Results</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 12px 18px;
      background: #222;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #ddd;
      font-size: 14px;
    }

    #gl {
      display: block;
      width: 100%;
      height: calc(100% - 80px);
    }
  </style>
</head>

<body>
  <header>
    <h1>Interactive ISC Results</h1>
    <p>
      Drag to navigate the image. Use the controls to inspect
      sagittal, coronal, axial, and 3D views.
    </p>
  </header>

  <canvas id="gl"></canvas>

  <script type="module">
    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.63.3/dist/index.js";

    const nv = new Niivue({
      show3Dcrosshair: true,
      backColor: [0.05, 0.05, 0.05, 1]
    });

    nv.attachTo("gl");

    const volumes = [
      {
        url: "./template.nii.gz",
        name: "MNI template",
        colormap: "gray",
        opacity: 1
      },
      {
        url: "./isc_map.nii.gz",
        name: "ISC map",
        colormap: "warm",
        opacity: 0.8
      }
    ];

    await nv.loadVolumes(volumes);
    nv.setSliceType(nv.sliceTypeMultiplanar);
  </script>
</body>
</html>
