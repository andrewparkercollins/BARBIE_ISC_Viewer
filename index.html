<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive BARBIE ISC Results</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 105px;
      padding: 10px 16px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0 0 8px;
      color: #ddd;
      font-size: 14px;
    }

    label {
      font-size: 14px;
    }

    select {
      margin-left: 6px;
      padding: 4px 8px;
      font-size: 14px;
    }

    #viewer-container {
      position: relative;
      width: 100%;
      height: calc(100% - 105px);
    }

    #gl {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      color: white;
      background: rgba(160, 0, 0, 0.9);
      border-radius: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <header>

    <h1>Interactive BARBIE ISC Results</h1>

    <p>
      Whole-brain inter-subject correlation results thresholded at
      FDR q &lt; .05 and cluster extent k ≥ 60 voxels.
    </p>

    <label for="modelSelect">
      Model:

      <select id="modelSelect">
        <option value="Intercept">Intercept</option>
        <option value="NN">Plasticity Difference (NN)</option>
        <option value="AnnaK">Mean Plasticity (AnnaK)</option>
      </select>
    </label>

  </header>


  <div id="viewer-container">

    <canvas id="gl"></canvas>

    <div id="error"></div>

  </div>


  <script type="module">

    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.69.0/dist/index.js";


    // ---------------------------------------------------------
    // FILES
    // ---------------------------------------------------------

    const underlayFile =
      "./MNI152_2009_template.nii.gz";


    const modelFiles = {

      Intercept:
        "./Intercept_q05_k60.nii.gz",

      NN:
        "./NN_q05_k60.nii.gz",

      AnnaK:
        "./AnnaK_q05_k60.nii.gz"

    };


    // ---------------------------------------------------------
    // PAGE ELEMENTS
    // ---------------------------------------------------------

    const errorBox =
      document.getElementById("error");

    const modelSelect =
      document.getElementById("modelSelect");


    // ---------------------------------------------------------
    // CREATE NIIVUE VIEWER
    // ---------------------------------------------------------

    const nv = new Niivue({

      isResizeCanvas: true,

      backColor: [
        0.05,
        0.05,
        0.05,
        1
      ],

      isColorbar: true

    });


    // ---------------------------------------------------------
    // LOAD A MODEL
    // ---------------------------------------------------------

    async function loadModel(modelName) {

      try {

        errorBox.style.display = "none";


        // Load:
        //   volume 0 = MNI anatomical underlay
        //   volume 1 = thresholded statistical map

        await nv.loadVolumes([

          {
            url: underlayFile,
            colormap: "gray",
            opacity: 1,
            colorbarVisible: false
          },

          {
            url: modelFiles[modelName],

            // Positive effects
            colormap: "warm",

            // Negative effects
            colormapNegative: "winter",

            useNegativeCmap: true,

            opacity: 0.9,

            colorbarVisible: true
          }

        ]);


        // -----------------------------------------------------
        // GET STATISTICAL OVERLAY
        // -----------------------------------------------------

        const overlay = nv.volumes[1];


        // -----------------------------------------------------
        // FIND NON-ZERO POSITIVE AND NEGATIVE RANGES
        //
        // The thresholded images contain:
        //
        //     significant values = actual coefficient
        //     non-significant voxels = 0
        //
        // We therefore calculate the display ranges while
        // completely ignoring zero.
        // -----------------------------------------------------

        let smallestPositive = Infinity;
        let largestPositive  = -Infinity;

        let mostNegative     = Infinity;
        let leastNegative    = -Infinity;


        for (
          let i = 0;
          i < overlay.img.length;
          i++
        ) {

          const value =
            overlay.img[i];


          // Positive surviving voxels

          if (value > 0) {

            if (value < smallestPositive) {

              smallestPositive =
                value;

            }

            if (value > largestPositive) {

              largestPositive =
                value;

            }

          }


          // Negative surviving voxels

          if (value < 0) {

            if (value < mostNegative) {

              mostNegative =
                value;

            }

            if (value > leastNegative) {

              leastNegative =
                value;

            }

          }

        }


        // -----------------------------------------------------
        // APPLY POSITIVE RANGE
        // -----------------------------------------------------

        if (
          smallestPositive !== Infinity
        ) {

          overlay.cal_min =
            smallestPositive;

          overlay.cal_max =
            largestPositive;

        }


        // -----------------------------------------------------
        // APPLY NEGATIVE RANGE
        // -----------------------------------------------------

        if (
          mostNegative !== Infinity
        ) {

          overlay.cal_minNeg =
            mostNegative;

          overlay.cal_maxNeg =
            leastNegative;

        }


        // -----------------------------------------------------
        // SPECIAL CASE: INTERCEPT
        //
        // The intercept is effectively a positive ISC map, so
        // we do not need a negative color scale for this model.
        // -----------------------------------------------------

        if (modelName === "Intercept") {

          overlay.useNegativeCmap =
            false;

        }

        else {

          overlay.useNegativeCmap =
            true;

        }


        // Hide anatomical-template color bar

        nv.volumes[0].colorbarVisible =
          false;


        // Refresh rendering after changing calibration values

        nv.updateGLVolume();


      }

      catch (error) {

        console.error(error);

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    // ---------------------------------------------------------
    // START VIEWER
    // ---------------------------------------------------------

    async function startViewer() {

      try {

        await nv.attachTo("gl");

        await loadModel(
          "Intercept"
        );

      }

      catch (error) {

        console.error(error);

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "Viewer error: " +
          (
            error?.message ||
            String(error)
          );

      }

    }


    // ---------------------------------------------------------
    // MODEL DROPDOWN
    // ---------------------------------------------------------

    modelSelect.addEventListener(
      "change",

      async function () {

        await loadModel(
          this.value
        );

      }
    );


    // ---------------------------------------------------------
    // GO
    // ---------------------------------------------------------

    startViewer();

  </script>

</body>
</html>
