<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iguana MRI Viewer</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      box-sizing: border-box;
      height: 75px;
      padding: 10px 16px;
      background: #222;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #ddd;
      font-size: 14px;
    }

    #gl {
      display: block;
      width: 100%;
      height: calc(100% - 75px);
    }
  </style>
</head>

<body>
  <header>
    <h1>Interactive Iguana MRI</h1>
    <p>Drag, scroll, and tap the image to explore the volume.</p>
  </header>

  <canvas id="gl"></canvas>

  <script type="module">
    import { Niivue }
      from "https://unpkg.com/@niivue/niivue@0.63.3/dist/index.js";

    const nv = new Niivue({
      backColor: [0.05, 0.05, 0.05, 1],
      show3Dcrosshair: true
    });

    nv.attachTo("gl");

    await nv.loadVolumes([
      {
        url: "./Iguana.nii.gz",
        name: "Iguana",
        colormap: "gray",
        opacity: 1
      }
    ]);

    nv.setSliceType(nv.sliceTypeMultiplanar);
  </script>
</body>
</html>
